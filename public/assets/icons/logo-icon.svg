<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="medcore-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Shield Rounded Rect -->
  <rect x="2" y="2" width="36" height="36" rx="10" fill="#0F172A" stroke="url(#medcore-grad)" stroke-width="1.5" />
  <!-- Medical Cross / Plus with Heartbeat Pulse Waveform -->
  <path d="M20 7V13M20 27V33M7 20H13M27 20H33" stroke="url(#medcore-grad)" stroke-width="2.5" stroke-linecap="round" />
  <!-- Electrocardiogram Pulse Line in Center -->
  <path d="M12 20H16L18 14L22 26L24 20H28" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <!-- Center AI Node -->
  <circle cx="20" cy="20" r="2.5" fill="#10B981" />
</svg>
